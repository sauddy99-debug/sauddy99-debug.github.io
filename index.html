<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14120F">
<title>Tapes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#14120F;
    --surface:#1E1B17;
    --surface-2:#28231D;
    --border:#332C23;
    --text:#F3EFE7;
    --text-muted:#948C7C;
    --text-faint:#5E574A;
    --rec:#E8542F;
    --rec-dim:#4A2A20;
    --play:#D9A441;
    --play-track:#3A332A;
    --danger:#C1453B;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
  }
  input{ -webkit-user-select:text; user-select:text; }

  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:
      radial-gradient(ellipse 600px 300px at 50% -10%, rgba(217,164,65,0.07), transparent 60%),
      var(--bg);
  }

  .view{ display:none; flex-direction:column; flex:1; min-height:0; }
  .view.active{ display:flex; }

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; gap:12px;
    padding:20px 20px 14px;
    position:sticky; top:0; z-index:5;
    background:linear-gradient(var(--bg) 70%, transparent);
  }
  .topbar h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:22px; font-weight:700; letter-spacing:-0.01em;
    margin:0; flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--surface);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    flex-shrink:0; cursor:pointer;
  }
  .icon-btn:active{ background:var(--surface-2); }
  .icon-btn.danger{ color:var(--danger); }
  .icon-btn svg{ width:18px; height:18px; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-faint); padding:0 20px; margin-top:-6px; margin-bottom:14px;
  }

  /* ---------- Scroll area ---------- */
  .scroll{ flex:1; overflow-y:auto; padding:0 16px 24px; -webkit-overflow-scrolling:touch; }

  /* ---------- Empty state ---------- */
  .empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; padding:60px 30px; color:var(--text-muted);
  }
  .empty svg{ width:40px; height:40px; opacity:0.5; margin-bottom:6px; }
  .empty .t1{ font-size:15px; font-weight:600; color:var(--text); }
  .empty .t2{ font-size:13px; line-height:1.5; }

  /* ---------- Cards ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:16px;
    margin-bottom:10px;
    display:flex; align-items:center; gap:14px;
    cursor:pointer;
  }
  .card:active{ background:var(--surface-2); }
  .card-icon{
    width:44px; height:44px; border-radius:var(--radius-md);
    background:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    color:var(--play);
  }
  .card-icon svg{ width:20px; height:20px; }
  .card-body{ flex:1; min-width:0; }
  .card-title{ font-size:15px; font-weight:600; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-sub{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text-muted); }
  .card-trash{
    width:34px; height:34px; border-radius:var(--radius-sm); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:var(--text-faint);
  }
  .card-trash:active{ color:var(--danger); background:rgba(193,69,59,0.12); }
  .card-trash svg{ width:16px; height:16px; }
  .chevron{ color:var(--text-faint); flex-shrink:0; }
  .chevron svg{ width:16px; height:16px; }

  /* ---------- FAB ---------- */
  .fab-wrap{ padding:14px 20px calc(18px + var(--safe-bottom)); }
  .fab{
    width:100%; border:none; border-radius:var(--radius-lg);
    background:var(--text); color:var(--bg);
    font-family:'Inter'; font-size:15px; font-weight:600;
    padding:16px; display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
  }
  .fab:active{ opacity:0.85; }
  .fab svg{ width:18px; height:18px; }
  .fab.rec-fab{ background:var(--rec); color:#fff; }

  /* ---------- Recording card w/ waveform ---------- */
  .rec-card{ flex-direction:column; align-items:stretch; cursor:default; }
  .rec-top{ display:flex; align-items:center; gap:12px; cursor:pointer; }
  .rec-actions{ display:flex; gap:6px; margin-top:12px; }
  .pill-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--border); background:var(--surface-2);
    border-radius:var(--radius-sm); padding:9px 8px; color:var(--text);
    font-family:'Inter'; font-size:12.5px; font-weight:500; cursor:pointer;
  }
  .pill-btn:active{ background:#332C23; }
  .pill-btn svg{ width:14px; height:14px; }
  .pill-btn.danger-pill{ color:var(--danger); }

  .waveform{
    display:flex; align-items:center; gap:2px;
    height:36px; margin-top:12px; cursor:pointer; padding:2px 0;
  }
  .waveform .bar{
    flex:1; min-width:2px; border-radius:2px;
    background:var(--play-track); transition:background .05s linear;
  }
  .time-row{
    display:flex; justify-content:space-between; margin-top:4px;
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-faint);
  }

  /* ---------- Recorder view ---------- */
  .recorder-stage{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px; padding:20px;
  }
  .append-tag{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--play);
    background:rgba(217,164,65,0.1); border:1px solid rgba(217,164,65,0.3);
    padding:6px 14px; border-radius:20px; max-width:90%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .rec-indicator{ display:flex; align-items:center; gap:10px; }
  .rec-dot{
    width:11px; height:11px; border-radius:50%; background:var(--text-faint);
  }
  .rec-dot.live{ background:var(--rec); animation:pulse 1.1s ease-in-out infinite; }
  .rec-dot.paused{ background:var(--play); animation:none; }
  @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:0.4; transform:scale(0.85);} }
  .rec-state-label{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--text-muted);
  }
  .timer{
    font-family:'IBM Plex Mono', monospace; font-weight:600;
    font-size:56px; letter-spacing:0.02em; color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .level-bars{ display:flex; align-items:flex-end; gap:4px; height:34px; }
  .level-bars .lb{ width:4px; border-radius:2px; background:var(--rec); opacity:0.85; height:4px; }

  .transport{ display:flex; align-items:center; gap:22px; }
  .transport-btn{
    display:flex; align-items:center; justify-content:center;
    border:none; cursor:pointer; color:#fff;
  }
  .btn-round{ width:64px; height:64px; border-radius:50%; }
  .btn-primary-round{ width:78px; height:78px; border-radius:50%; }
  .transport-btn svg{ width:26px; height:26px; }
  .btn-record{ background:var(--rec); }
  .btn-pause{ background:var(--surface-2); border:1px solid var(--border); color:var(--text); }
  .btn-resume{ background:var(--rec); }
  .btn-stop{ background:var(--text); color:var(--bg); }
  .btn-stop svg{ width:22px; height:22px; }

  .recorder-hint{ font-size:13px; color:var(--text-faint); text-align:center; max-width:260px; }

  /* ---------- Save / append panel ---------- */
  .panel{
    padding:20px 20px calc(20px + var(--safe-bottom));
    border-top:1px solid var(--border);
    background:var(--surface);
    display:flex; flex-direction:column; gap:14px;
  }
  .panel-title{ font-size:14px; font-weight:600; color:var(--text-muted); }
  .field-label{ font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); margin-bottom:6px; display:block;}
  .text-input{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:13px 14px; color:var(--text);
    font-family:'Inter'; font-size:15px;
  }
  .text-input:focus{ outline:none; border-color:var(--play); }
  .panel-row{ display:flex; gap:10px; }
  .btn{
    flex:1; padding:14px; border-radius:var(--radius-md); border:none;
    font-family:'Inter'; font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .btn-ghost{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .btn-solid{ background:var(--text); color:var(--bg); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn:active{ opacity:0.85; }

  /* ---------- Mini player bar ---------- */
  .mini-hint{ font-size:12px; color:var(--text-faint); text-align:center; padding:6px 0 2px; }

  /* ---------- Modal (confirm/new project) ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:none; align-items:flex-end; justify-content:center; z-index:20;
  }
  .modal-backdrop.active{ display:flex; }
  .modal-sheet{
    width:100%; max-width:520px; background:var(--surface);
    border-radius:20px 20px 0 0; border:1px solid var(--border); border-bottom:none;
    padding:22px 20px calc(22px + var(--safe-bottom));
    display:flex; flex-direction:column; gap:16px;
  }
  .modal-title{ font-family:'Space Grotesk', sans-serif; font-size:18px; font-weight:600; }
  .modal-desc{ font-size:13.5px; color:var(--text-muted); line-height:1.5; margin-top:-8px; }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>

<div id="app">

  <!-- ============ PROJECTS VIEW ============ -->
  <div class="view active" id="view-projects">
    <div class="topbar">
      <h1>Tapes</h1>
      <button class="icon-btn" id="btn-new-project" aria-label="New project">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="eyebrow">Projects</div>
    <div class="scroll" id="projects-list"></div>
  </div>

  <!-- ============ PROJECT (RECORDINGS) VIEW ============ -->
  <div class="view" id="view-project">
    <div class="topbar">
      <button class="icon-btn" id="btn-back-to-projects" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="project-title">Project</h1>
      <button class="icon-btn danger" id="btn-delete-project" aria-label="Delete project">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg>
      </button>
    </div>
    <div class="eyebrow" id="project-count">Recordings</div>
    <div class="scroll" id="recordings-list"></div>
    <div class="fab-wrap">
      <button class="fab rec-fab" id="btn-new-recording">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        Record new
      </button>
    </div>
  </div>

  <!-- ============ RECORDER VIEW ============ -->
  <div class="view" id="view-recorder">
    <div class="topbar">
      <button class="icon-btn" id="btn-cancel-recorder" aria-label="Cancel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <h1 id="recorder-title">New recording</h1>
      <div style="width:38px"></div>
    </div>

    <div class="recorder-stage" id="recorder-stage">
      <div class="append-tag" id="append-tag" style="display:none;"></div>
      <div class="rec-indicator">
        <div class="rec-dot" id="rec-dot"></div>
        <div class="rec-state-label" id="rec-state-label">Ready</div>
      </div>
      <div class="timer" id="timer">00:00</div>
      <div class="level-bars" id="level-bars"></div>
      <div class="transport" id="transport-idle">
        <button class="transport-btn btn-primary-round btn-record" id="btn-start-record" aria-label="Start recording">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>
        </button>
      </div>
      <div class="transport" id="transport-active" style="display:none;">
        <button class="transport-btn btn-round btn-pause" id="btn-pause-resume" aria-label="Pause">
          <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <svg id="icon-resume" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="transport-btn btn-primary-round btn-stop" id="btn-stop-record" aria-label="Stop">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
        </button>
      </div>
      <div class="recorder-hint" id="recorder-hint">Tap the button to start recording. Keep the app open while recording.</div>
    </div>

    <!-- Save panel (new recording) -->
    <div class="panel" id="panel-save" style="display:none;">
      <div class="panel-title">Save recording</div>
      <div>
        <label class="field-label">Name</label>
        <input type="text" class="text-input" id="input-recording-name" maxlength="80">
      </div>
      <div class="panel-row">
        <button class="btn btn-ghost" id="btn-discard-new">Discard</button>
        <button class="btn btn-solid" id="btn-save-new">Save</button>
      </div>
    </div>

    <!-- Save panel (append) -->
    <div class="panel" id="panel-append" style="display:none;">
      <div class="panel-title" id="append-panel-title">Add this to the recording?</div>
      <div class="panel-row">
        <button class="btn btn-ghost" id="btn-discard-append">Discard</button>
        <button class="btn btn-solid" id="btn-save-append">Append &amp; save</button>
      </div>
    </div>
  </div>

</div>

<!-- Shared confirm modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal-sheet" id="modal-sheet"></div>
</div>

<audio id="player" style="display:none;"></audio>

<script>
(function(){
'use strict';

/* ===================== IndexedDB layer ===================== */
const DB_NAME = 'TapesDB';
const DB_VERSION = 1;
let dbPromise = null;

function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('projects')){
        db.createObjectStore('projects', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('recordings')){
        const store = db.createObjectStore('recordings', { keyPath: 'id' });
        store.createIndex('projectId', 'projectId', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function tx(storeName, mode){
  return openDB().then(db => db.transaction(storeName, mode).objectStore(storeName));
}

function reqToPromise(req){
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

const DB = {
  async putProject(p){ const s = await tx('projects','readwrite'); return reqToPromise(s.put(p)); },
  async getAllProjects(){ const s = await tx('projects','readonly'); return reqToPromise(s.getAll()); },
  async deleteProject(id){ const s = await tx('projects','readwrite'); return reqToPromise(s.delete(id)); },
  async putRecording(r){ const s = await tx('recordings','readwrite'); return reqToPromise(s.put(r)); },
  async getRecording(id){ const s = await tx('recordings','readonly'); return reqToPromise(s.get(id)); },
  async deleteRecording(id){ const s = await tx('recordings','readwrite'); return reqToPromise(s.delete(id)); },
  async getRecordingsForProject(projectId){
    const s = await tx('recordings','readonly');
    const idx = s.index('projectId');
    return reqToPromise(idx.getAll(projectId));
  },
  async deleteRecordingsForProject(projectId){
    const recs = await DB.getRecordingsForProject(projectId);
    const s = await tx('recordings','readwrite');
    recs.forEach(r => s.delete(r.id));
  }
};

/* ===================== Utilities ===================== */
function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function fmtTime(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function fmtTimestamp(ts){
  const d = new Date(ts);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let h = d.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${months[d.getMonth()]} ${d.getDate()}, ${h}:${min} ${ampm}`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ===================== WAV encode ===================== */
function encodeWAV(samples, sampleRate){
  const numChannels = 1;
  const bytesPerSample = 2;
  const blockAlign = numChannels * bytesPerSample;
  const dataLength = samples.length * bytesPerSample;
  const buffer = new ArrayBuffer(44 + dataLength);
  const view = new DataView(buffer);

  function writeString(offset, str){
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataLength, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bytesPerSample * 8, true);
  writeString(36, 'data');
  view.setUint32(40, dataLength, true);

  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2){
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([view], { type: 'audio/wav' });
}

async function decodeBlobToFloat32(blob){
  const arrayBuffer = await blob.arrayBuffer();
  const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
  const audioBuffer = await tempCtx.decodeAudioData(arrayBuffer.slice(0));
  const data = audioBuffer.getChannelData(0).slice();
  const sr = audioBuffer.sampleRate;
  tempCtx.close();
  return { data, sampleRate: sr };
}

function resample(float32Arr, fromRate, toRate){
  if (fromRate === toRate) return float32Arr;
  const ratio = fromRate / toRate;
  const newLength = Math.round(float32Arr.length / ratio);
  const result = new Float32Array(newLength);
  for (let i = 0; i < newLength; i++){
    const srcIndex = i * ratio;
    const idx0 = Math.floor(srcIndex);
    const idx1 = Math.min(idx0 + 1, float32Arr.length - 1);
    const frac = srcIndex - idx0;
    result[i] = float32Arr[idx0] * (1 - frac) + float32Arr[idx1] * frac;
  }
  return result;
}

function concatFloat32(a, b){
  const out = new Float32Array(a.length + b.length);
  out.set(a, 0);
  out.set(b, a.length);
  return out;
}

function computePeaks(samples, numBuckets){
  const peaks = new Array(numBuckets).fill(0);
  const bucketSize = Math.max(1, Math.floor(samples.length / numBuckets));
  for (let i = 0; i < numBuckets; i++){
    const start = i * bucketSize;
    const end = Math.min(samples.length, start + bucketSize);
    let max = 0;
    for (let j = start; j < end; j++){
      const v = Math.abs(samples[j]);
      if (v > max) max = v;
    }
    peaks[i] = max;
  }
  return peaks;
}

/* ===================== App state ===================== */
const RECORD_SAMPLE_RATE = 44100;
const NUM_PEAKS = 56;

let state = {
  currentProjectId: null,
  recorder: {
    active: false,
    paused: false,
    audioCtx: null,
    stream: null,
    source: null,
    processor: null,
    silentGain: null,
    chunks: [],
    totalSamples: 0,
    appendTargetId: null, // recording id being appended to, or null for new
    pendingBlob: null,
    pendingPeaks: null,
    pendingDuration: 0,
    timerInterval: null,
    levelInterval: null
  },
  player: {
    currentRecordingId: null
  }
};

/* ===================== View switching ===================== */
function showView(id){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ===================== Modal helper ===================== */
function openModal(html){
  document.getElementById('modal-sheet').innerHTML = html;
  document.getElementById('modal-backdrop').classList.add('active');
}
function closeModal(){
  document.getElementById('modal-backdrop').classList.remove('active');
  document.getElementById('modal-sheet').innerHTML = '';
}
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') closeModal();
});

function confirmDialog({title, desc, confirmLabel, danger, onConfirm}){
  openModal(`
    <div class="modal-title">${escapeHtml(title)}</div>
    ${desc ? `<div class="modal-desc">${escapeHtml(desc)}</div>` : ''}
    <div class="panel-row">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-solid'}" id="modal-confirm">${escapeHtml(confirmLabel)}</button>
    </div>
  `);
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-confirm').onclick = () => { closeModal(); onConfirm(); };
}

/* ===================== Projects view ===================== */
async function renderProjects(){
  const listEl = document.getElementById('projects-list');
  const projects = await DB.getAllProjects();
  projects.sort((a,b) => b.createdAt - a.createdAt);

  if (projects.length === 0){
    listEl.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        <div class="t1">No projects yet</div>
        <div class="t2">Tap the + button to create your first project and start recording.</div>
      </div>`;
    return;
  }

  const counts = await Promise.all(projects.map(p => DB.getRecordingsForProject(p.id).then(r => r.length)));

  listEl.innerHTML = projects.map((p, i) => `
    <div class="card" data-project-id="${p.id}">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">${escapeHtml(p.name)}</div>
        <div class="card-sub">${counts[i]} recording${counts[i] === 1 ? '' : 's'}</div>
      </div>
      <div class="card-trash" data-delete-project="${p.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg>
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('[data-delete-project]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.getAttribute('data-delete-project');
      const proj = projects.find(p => p.id === id);
      confirmDialog({
        title: `Delete "${proj.name}"?`,
        desc: 'This deletes the project and every recording inside it. This can\'t be undone.',
        confirmLabel: 'Delete',
        danger: true,
        onConfirm: async () => {
          await DB.deleteRecordingsForProject(id);
          await DB.deleteProject(id);
          renderProjects();
        }
      });
    });
  });

  listEl.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => openProject(el.getAttribute('data-project-id')));
  });
}

document.getElementById('btn-new-project').addEventListener('click', () => {
  openModal(`
    <div class="modal-title">New project</div>
    <div>
      <label class="field-label">Name</label>
      <input type="text" class="text-input" id="input-project-name" placeholder="e.g. Interview notes" maxlength="60">
    </div>
    <div class="panel-row">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn btn-solid" id="modal-create-project">Create</button>
    </div>
  `);
  const input = document.getElementById('input-project-name');
  setTimeout(() => input.focus(), 50);
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-create-project').onclick = async () => {
    const name = input.value.trim() || 'Untitled project';
    await DB.putProject({ id: uid(), name, createdAt: Date.now() });
    closeModal();
    renderProjects();
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('modal-create-project').click();
  });
});

/* ===================== Project (recordings) view ===================== */
async function openProject(projectId){
  state.currentProjectId = projectId;
  const projects = await DB.getAllProjects();
  const project = projects.find(p => p.id === projectId);
  if (!project) return;
  document.getElementById('project-title').textContent = project.name;
  showView('view-project');
  await renderRecordings();
}

async function renderRecordings(){
  const listEl = document.getElementById('recordings-list');
  const recs = await DB.getRecordingsForProject(state.currentProjectId);
  recs.sort((a,b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt));
  document.getElementById('project-count').textContent = `Recordings (${recs.length})`;

  stopPlayback();

  if (recs.length === 0){
    listEl.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
        <div class="t1">No recordings yet</div>
        <div class="t2">Tap "Record new" below to make your first recording in this project.</div>
      </div>`;
    return;
  }

  listEl.innerHTML = recs.map(r => `
    <div class="card rec-card" data-rec-id="${r.id}">
      <div class="rec-top" data-play-toggle="${r.id}">
        <div class="card-icon" data-icon-for="${r.id}">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="card-body">
          <div class="card-title">${escapeHtml(r.name)}</div>
          <div class="card-sub">${fmtTimestamp(r.createdAt)} · ${fmtTime(r.duration)}</div>
        </div>
      </div>
      <div class="waveform" data-waveform-for="${r.id}"></div>
      <div class="time-row">
        <span data-current-for="${r.id}">00:00</span>
        <span>${fmtTime(r.duration)}</span>
      </div>
      <div class="rec-actions">
        <div class="pill-btn" data-append="${r.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Append
        </div>
        <div class="pill-btn danger-pill" data-delete-rec="${r.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg>
          Delete
        </div>
      </div>
    </div>
  `).join('');

  recs.forEach(r => {
    const wf = listEl.querySelector(`[data-waveform-for="${r.id}"]`);
    const peaks = r.peaks && r.peaks.length ? r.peaks : new Array(NUM_PEAKS).fill(0.15);
    wf.innerHTML = peaks.map(p => `<span class="bar" style="height:${Math.max(8, p * 100)}%"></span>`).join('');
    wf.addEventListener('click', (e) => onWaveformClick(e, r));
  });

  listEl.querySelectorAll('[data-play-toggle]').forEach(el => {
    el.addEventListener('click', () => togglePlay(el.getAttribute('data-play-toggle'), recs));
  });
  listEl.querySelectorAll('[data-append]').forEach(el => {
    el.addEventListener('click', () => startRecorder(el.getAttribute('data-append')));
  });
  listEl.querySelectorAll('[data-delete-rec]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-delete-rec');
      const rec = recs.find(r => r.id === id);
      confirmDialog({
        title: `Delete "${rec.name}"?`,
        desc: 'This recording will be permanently removed.',
        confirmLabel: 'Delete',
        danger: true,
        onConfirm: async () => {
          if (state.player.currentRecordingId === id) stopPlayback();
          await DB.deleteRecording(id);
          renderRecordings();
        }
      });
    });
  });
}

document.getElementById('btn-back-to-projects').addEventListener('click', () => {
  stopPlayback();
  showView('view-projects');
  renderProjects();
});

document.getElementById('btn-delete-project').addEventListener('click', async () => {
  const projects = await DB.getAllProjects();
  const project = projects.find(p => p.id === state.currentProjectId);
  confirmDialog({
    title: `Delete "${project.name}"?`,
    desc: 'This deletes the project and every recording inside it. This can\'t be undone.',
    confirmLabel: 'Delete',
    danger: true,
    onConfirm: async () => {
      await DB.deleteRecordingsForProject(state.currentProjectId);
      await DB.deleteProject(state.currentProjectId);
      showView('view-projects');
      renderProjects();
    }
  });
});

document.getElementById('btn-new-recording').addEventListener('click', () => startRecorder(null));

/* ===================== Playback ===================== */
const playerEl = document.getElementById('player');

function stopPlayback(){
  playerEl.pause();
  playerEl.removeAttribute('src');
  if (state.player.currentRecordingId){
    resetPlayIcon(state.player.currentRecordingId);
  }
  state.player.currentRecordingId = null;
}

function resetPlayIcon(id){
  const icon = document.querySelector(`[data-icon-for="${id}"]`);
  if (icon) icon.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
}

async function togglePlay(id, recs){
  if (state.player.currentRecordingId === id){
    if (playerEl.paused) { playerEl.play(); setPlayIcon(id, true); }
    else { playerEl.pause(); setPlayIcon(id, false); }
    return;
  }
  if (state.player.currentRecordingId) stopPlayback();

  const rec = await DB.getRecording(id);
  if (!rec) return;
  const url = URL.createObjectURL(rec.audioBlob);
  playerEl.src = url;
  state.player.currentRecordingId = id;
  setPlayIcon(id, true);
  try { await playerEl.play(); } catch(e) { /* needs user gesture; already have one */ }

  playerEl.ontimeupdate = () => updateWaveformProgress(id, playerEl.currentTime, rec.duration);
  playerEl.onended = () => { setPlayIcon(id, false); updateWaveformProgress(id, 0, rec.duration); };
}

function setPlayIcon(id, playing){
  const icon = document.querySelector(`[data-icon-for="${id}"]`);
  if (!icon) return;
  icon.innerHTML = playing
    ? `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
}

function updateWaveformProgress(id, currentTime, duration){
  const wf = document.querySelector(`[data-waveform-for="${id}"]`);
  const timeLabel = document.querySelector(`[data-current-for="${id}"]`);
  if (timeLabel) timeLabel.textContent = fmtTime(currentTime);
  if (!wf) return;
  const bars = wf.querySelectorAll('.bar');
  const fraction = duration > 0 ? currentTime / duration : 0;
  const activeCount = Math.floor(fraction * bars.length);
  bars.forEach((bar, i) => {
    bar.style.background = i < activeCount ? 'var(--play)' : 'var(--play-track)';
  });
}

function onWaveformClick(e, rec){
  const wf = e.currentTarget;
  const rect = wf.getBoundingClientRect();
  const fraction = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  if (state.player.currentRecordingId !== rec.id){
    togglePlay(rec.id).then(() => {
      playerEl.currentTime = fraction * rec.duration;
    });
  } else {
    playerEl.currentTime = fraction * rec.duration;
    if (playerEl.paused){ playerEl.play(); setPlayIcon(rec.id, true); }
  }
}

/* ===================== Recorder ===================== */
const rec = state.recorder;

function resetRecorderUI(){
  document.getElementById('timer').textContent = '00:00';
  document.getElementById('rec-dot').className = 'rec-dot';
  document.getElementById('rec-state-label').textContent = 'Ready';
  document.getElementById('transport-idle').style.display = 'flex';
  document.getElementById('transport-active').style.display = 'none';
  document.getElementById('panel-save').style.display = 'none';
  document.getElementById('panel-append').style.display = 'none';
  document.getElementById('recorder-hint').style.display = 'block';
  document.getElementById('level-bars').innerHTML = '';
  document.getElementById('icon-pause').style.display = 'inline';
  document.getElementById('icon-resume').style.display = 'none';
}

async function startRecorder(appendTargetId){
  rec.appendTargetId = appendTargetId;
  rec.chunks = [];
  rec.totalSamples = 0;
  rec.pendingBlob = null;
  resetRecorderUI();

  const appendTag = document.getElementById('append-tag');
  if (appendTargetId){
    const target = await DB.getRecording(appendTargetId);
    appendTag.style.display = 'inline-block';
    appendTag.textContent = `Appending to "${target.name}" (${fmtTime(target.duration)})`;
    document.getElementById('recorder-title').textContent = 'Append recording';
  } else {
    appendTag.style.display = 'none';
    document.getElementById('recorder-title').textContent = 'New recording';
  }

  showView('view-recorder');
}

document.getElementById('btn-cancel-recorder').addEventListener('click', () => {
  cancelRecordingIfActive();
  showView('view-project');
});

async function ensureMic(){
  const stream = await navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: true, noiseSuppression: true, autoGainControl: true
  }});
  return stream;
}

document.getElementById('btn-start-record').addEventListener('click', async () => {
  try{
    rec.stream = await ensureMic();
  } catch(err){
    alert('Microphone access is needed to record. Please allow microphone permission and try again.');
    return;
  }

  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  rec.audioCtx = new AudioCtx({ sampleRate: RECORD_SAMPLE_RATE });
  rec.actualSampleRate = rec.audioCtx.sampleRate; // browsers may not honor the requested rate exactly
  rec.source = rec.audioCtx.createMediaStreamSource(rec.stream);
  rec.processor = rec.audioCtx.createScriptProcessor(4096, 1, 1);
  rec.silentGain = rec.audioCtx.createGain();
  rec.silentGain.gain.value = 0;

  rec.paused = false;
  rec.active = true;

  rec.processor.onaudioprocess = (e) => {
    if (!rec.active || rec.paused) return;
    const input = e.inputBuffer.getChannelData(0);
    rec.chunks.push(new Float32Array(input));
    rec.totalSamples += input.length;
  };

  rec.source.connect(rec.processor);
  rec.processor.connect(rec.silentGain);
  rec.silentGain.connect(rec.audioCtx.destination);

  document.getElementById('transport-idle').style.display = 'none';
  document.getElementById('transport-active').style.display = 'flex';
  document.getElementById('recorder-hint').style.display = 'none';
  setRecordingIndicator('live');

  rec.timerInterval = setInterval(() => {
    const secs = rec.totalSamples / (rec.actualSampleRate || RECORD_SAMPLE_RATE);
    document.getElementById('timer').textContent = fmtTime(secs);
  }, 200);

  startLevelMeter();
});

function setRecordingIndicator(mode){
  const dot = document.getElementById('rec-dot');
  const label = document.getElementById('rec-state-label');
  if (mode === 'live'){ dot.className = 'rec-dot live'; label.textContent = 'Recording'; }
  else if (mode === 'paused'){ dot.className = 'rec-dot paused'; label.textContent = 'Paused'; }
}

function startLevelMeter(){
  const levelBarsEl = document.getElementById('level-bars');
  const barCount = 20;
  levelBarsEl.innerHTML = Array.from({length: barCount}, () => '<div class="lb"></div>').join('');
  const bars = levelBarsEl.querySelectorAll('.lb');
  rec.levelInterval = setInterval(() => {
    if (!rec.active) return;
    const recentChunk = rec.chunks[rec.chunks.length - 1];
    let level = 0;
    if (recentChunk && !rec.paused){
      let sum = 0;
      for (let i = 0; i < recentChunk.length; i += 8) sum += Math.abs(recentChunk[i]);
      level = Math.min(1, (sum / (recentChunk.length / 8)) * 6);
    }
    bars.forEach((b) => {
      const h = rec.paused ? 4 : Math.max(4, Math.random() * level * 34);
      b.style.height = h + 'px';
    });
  }, 120);
}

document.getElementById('btn-pause-resume').addEventListener('click', () => {
  rec.paused = !rec.paused;
  document.getElementById('icon-pause').style.display = rec.paused ? 'none' : 'inline';
  document.getElementById('icon-resume').style.display = rec.paused ? 'inline' : 'none';
  setRecordingIndicator(rec.paused ? 'paused' : 'live');
});

document.getElementById('btn-stop-record').addEventListener('click', async () => {
  await finishCapture();

  if (rec.totalSamples === 0){
    alert('No audio was captured. Please try recording again.');
    resetRecorderUI();
    showView('view-project');
    return;
  }

  const merged = new Float32Array(rec.totalSamples);
  let offset = 0;
  for (const chunk of rec.chunks){
    merged.set(chunk, offset);
    offset += chunk.length;
  }

  rec.pendingRawSamples = merged;
  rec.pendingSampleRate = rec.actualSampleRate || RECORD_SAMPLE_RATE;
  rec.pendingDuration = merged.length / rec.pendingSampleRate;

  document.getElementById('transport-active').style.display = 'none';
  setRecordingIndicator('idle');
  document.getElementById('rec-state-label').textContent = 'Stopped';

  if (rec.appendTargetId){
    const target = await DB.getRecording(rec.appendTargetId);
    document.getElementById('append-panel-title').textContent =
      `Add ${fmtTime(rec.pendingDuration)} to "${target.name}"? New total: ${fmtTime(target.duration + rec.pendingDuration)}`;
    document.getElementById('panel-append').style.display = 'flex';
  } else {
    const input = document.getElementById('input-recording-name');
    input.value = `Recording — ${fmtTimestamp(Date.now())}`;
    document.getElementById('panel-save').style.display = 'flex';
    setTimeout(() => { input.focus(); input.select(); }, 50);
  }
});

async function finishCapture(){
  rec.active = false;
  clearInterval(rec.timerInterval);
  clearInterval(rec.levelInterval);
  try{ rec.processor && rec.processor.disconnect(); }catch(e){}
  try{ rec.source && rec.source.disconnect(); }catch(e){}
  try{ rec.silentGain && rec.silentGain.disconnect(); }catch(e){}
  if (rec.stream){ rec.stream.getTracks().forEach(t => t.stop()); }
  if (rec.audioCtx){ try{ await rec.audioCtx.close(); }catch(e){} }
}

function cancelRecordingIfActive(){
  if (rec.active) finishCapture();
  rec.chunks = [];
  rec.totalSamples = 0;
  rec.appendTargetId = null;
}

/* ---- Save new recording ---- */
document.getElementById('btn-discard-new').addEventListener('click', () => {
  resetRecorderUI();
  showView('view-project');
});

document.getElementById('btn-save-new').addEventListener('click', async () => {
  const name = document.getElementById('input-recording-name').value.trim() || `Recording — ${fmtTimestamp(Date.now())}`;
  const blob = encodeWAV(rec.pendingRawSamples, rec.pendingSampleRate);
  const peaks = computePeaks(rec.pendingRawSamples, NUM_PEAKS);
  const now = Date.now();
  await DB.putRecording({
    id: uid(),
    projectId: state.currentProjectId,
    name,
    createdAt: now,
    updatedAt: now,
    duration: rec.pendingDuration,
    sampleRate: rec.pendingSampleRate,
    peaks,
    audioBlob: blob
  });
  resetRecorderUI();
  showView('view-project');
  renderRecordings();
});

/* ---- Save appended recording ---- */
document.getElementById('btn-discard-append').addEventListener('click', () => {
  resetRecorderUI();
  showView('view-project');
});

document.getElementById('btn-save-append').addEventListener('click', async () => {
  const target = await DB.getRecording(rec.appendTargetId);
  if (!target){ resetRecorderUI(); showView('view-project'); return; }

  const { data: existingSamples, sampleRate: existingRate } = await decodeBlobToFloat32(target.audioBlob);
  const existingResampled = resample(existingSamples, existingRate, rec.pendingSampleRate);
  const merged = concatFloat32(existingResampled, rec.pendingRawSamples);

  const blob = encodeWAV(merged, rec.pendingSampleRate);
  const peaks = computePeaks(merged, NUM_PEAKS);

  await DB.putRecording({
    ...target,
    duration: merged.length / rec.pendingSampleRate,
    sampleRate: rec.pendingSampleRate,
    peaks,
    audioBlob: blob,
    updatedAt: Date.now()
  });

  resetRecorderUI();
  showView('view-project');
  renderRecordings();
});

/* ===================== Init ===================== */
renderProjects();

})();
</script>
